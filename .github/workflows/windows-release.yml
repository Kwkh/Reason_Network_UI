name: Windows Release

# 只在手动触发或推送 windows-v* 标签时构建安装包，避免每次提交都跑完整发布链。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签（留空则用 windows-v<版本>）'
        required: false
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  backend:
    name: 构建内置后台
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（MSVC）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 从固定上游提交构建后台
        shell: pwsh
        run: ./Engine/build-windows.ps1

      - name: 本机冒烟测试
        shell: pwsh
        run: ./Tests/windows-smoke.ps1

      - name: 上传后台二进制
        uses: actions/upload-artifact@v4
        with:
          name: reason-network-backend
          path: Engine/Bin/reason-network-backend.exe
          if-no-files-found: error

  installer:
    name: 构建 NSIS 安装包
    runs-on: windows-latest
    needs: backend
    env:
      # 更新签名密钥：缺失时 build-release.mjs 自动退化为只出普通安装包。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Windows/package-lock.json

      - name: 安装 Rust（MSVC）
        uses: dtolnay/rust-toolchain@stable

      - name: 取回后台二进制
        uses: actions/download-artifact@v4
        with:
          name: reason-network-backend
          path: Engine/Bin

      - name: 安装前端依赖
        working-directory: Windows
        run: npm ci

      - name: 构建 NSIS 安装包
        working-directory: Windows
        run: npm run tauri:build

      - name: 计算版本与标签
        id: meta
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content Windows/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:TAG_INPUT }
          if (-not $tag) { $tag = "windows-v$version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: 生成 latest.json
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        working-directory: Windows
        run: node scripts/latest-json.mjs --version "${{ steps.meta.outputs.version }}" --tag "${{ steps.meta.outputs.tag }}"

      - name: 签名安装包（配置证书时）
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw '找不到 signtool.exe' }
          Get-ChildItem Windows/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:CERT_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "签名失败：$($_.Name)" }
          }
          Remove-Item $pfx -Force

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: reason-network-windows-nsis
          path: Windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 上传更新包与清单
        uses: actions/upload-artifact@v4
        with:
          name: reason-network-windows-update
          path: |
            Windows/src-tauri/target/release/bundle/nsis/*.exe.sig
            Windows/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: warn

      - name: 创建草稿 Release（标签触发时）
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $dir = 'Windows/src-tauri/target/release/bundle/nsis'
          $files = @()
          foreach ($pattern in @('*.exe', '*.exe.sig', 'latest.json')) {
            $files += Get-ChildItem (Join-Path $dir $pattern) -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          }
          if ($files.Count -eq 0) { throw '没有可上传的发布文件' }
          gh release create $tag $files --draft --title "Reason Network Windows $version" --notes "Windows 构建 $version。发布前请确认更新签名公钥与 latest.json 匹配。"

